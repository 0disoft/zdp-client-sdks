name: CI

on:
  pull_request:
  push:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: projects/zdp-platforms/contracts/zdp-client-sdks

    steps:
      - name: Checkout client SDKs
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
          path: projects/zdp-platforms/contracts/zdp-client-sdks

      - name: Checkout API contracts
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
          repository: 0disoft/zdp-api-contracts
          ref: 73cfb01c01796e204bb9ba13131cd218a16e4ec5
          path: projects/zdp-platforms/contracts/zdp-api-contracts

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Install API contracts dependencies
        working-directory: projects/zdp-platforms/contracts/zdp-api-contracts
        run: bun install --frozen-lockfile

      - name: Install client SDK dependencies
        run: bun install --frozen-lockfile

      - name: Check
        run: bun run check

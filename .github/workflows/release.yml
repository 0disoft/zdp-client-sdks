name: Publish npm package

on:
  push:
    tags:
      - "v*"

permissions: {}

concurrency:
  group: npm-release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and verify package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    defaults:
      run:
        working-directory: projects/zdp-platforms/contracts/zdp-client-sdks

    steps:
      - name: Checkout client SDKs
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
          path: projects/zdp-platforms/contracts/zdp-client-sdks

      - name: Checkout API contracts
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
          repository: 0disoft/zdp-api-contracts
          ref: 73cfb01c01796e204bb9ba13131cd218a16e4ec5
          path: projects/zdp-platforms/contracts/zdp-api-contracts

      - name: Verify tagged commit is on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" "origin/main"; then
            echo "::error::Release tag must point to a commit contained in origin/main."
            exit 1
          fi

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "24.18.0"
          package-manager-cache: false
          registry-url: https://registry.npmjs.org

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
          no-cache: true

      - name: Verify trusted publishing runtime
        run: |
          npm_version="$(npm --version)"
          if [ "$npm_version" != "11.16.0" ]; then
            echo "::error::Release packaging requires npm 11.16.0, received ${npm_version}."
            exit 1
          fi

      - name: Verify release tag
        run: |
          package_version="$(node -p "require('./package.json').version")"
          expected_tag="v${package_version}"
          if [ "$GITHUB_REF_NAME" != "$expected_tag" ]; then
            echo "::error::Release tag ${GITHUB_REF_NAME} does not match package.json version ${package_version}."
            exit 1
          fi

      - name: Install API contracts dependencies
        working-directory: projects/zdp-platforms/contracts/zdp-api-contracts
        run: bun install --frozen-lockfile

      - name: Install client SDK dependencies
        run: bun install --frozen-lockfile

      - name: Verify package contracts
        run: bun run check

      - name: Build package artifact
        id: package_artifact
        run: >-
          bun scripts/build-release-artifact.ts
          --git-head "$GITHUB_SHA"
          --github-output "$GITHUB_OUTPUT"

      - name: Verify packed consumer
        run: >-
          bun scripts/smoke-packed-package.ts
          --tarball "${{ steps.package_artifact.outputs.tarball }}"

      - name: Upload verified package artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: npm-release-artifact
          path: |
            projects/zdp-platforms/contracts/zdp-client-sdks/${{ steps.package_artifact.outputs.tarball }}
            projects/zdp-platforms/contracts/zdp-client-sdks/${{ steps.package_artifact.outputs.manifest }}
            projects/zdp-platforms/contracts/zdp-client-sdks/${{ steps.package_artifact.outputs.notes }}
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish verified package to npm
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: npm
    permissions:
      id-token: write

    defaults:
      run:
        working-directory: release-artifact

    steps:
      - name: Download verified package artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: npm-release-artifact
          path: release-artifact

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "24.18.0"
          package-manager-cache: false
          registry-url: https://registry.npmjs.org

      - name: Verify artifact identity and integrity
        id: artifact
        run: |
          node --input-type=commonjs <<'NODE'
          const fs = require('node:fs');
          const crypto = require('node:crypto');
          const manifest = JSON.parse(fs.readFileSync('release-artifact.json', 'utf8'));
          if (manifest.schemaVersion !== 'zdp.npm-release-artifact/v1') throw new Error('Unexpected release manifest schema.');
          if (manifest.gitHead !== process.env.GITHUB_SHA) throw new Error('Artifact gitHead does not match release tag SHA.');
          if (`v${manifest.version}` !== process.env.GITHUB_REF_NAME) throw new Error('Artifact version does not match release tag.');
          if (!/^[a-z0-9][a-z0-9._-]*\.tgz$/.test(manifest.tarball)) throw new Error('Unsafe tarball name.');
          const bytes = fs.readFileSync(manifest.tarball);
          const integrity = `sha512-${crypto.createHash('sha512').update(bytes).digest('base64')}`;
          if (integrity !== manifest.integrity) throw new Error('Artifact integrity mismatch.');
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `package=${manifest.package}\nversion=${manifest.version}\ntarball=${manifest.tarball}\nintegrity=${integrity}\n`);
          NODE

      - name: Check npm registry state
        id: npm_state
        run: |
          set +e
          npm view "${{ steps.artifact.outputs.package }}@${{ steps.artifact.outputs.version }}" version gitHead dist.integrity --json > npm-state.json 2> npm-state.err
          npm_status=$?
          set -e
          if [ "$npm_status" -eq 0 ]; then
            published_git_head="$(npm view "${{ steps.artifact.outputs.package }}@${{ steps.artifact.outputs.version }}" gitHead)"
            published_integrity="$(npm view "${{ steps.artifact.outputs.package }}@${{ steps.artifact.outputs.version }}" dist.integrity)"
            test "$published_git_head" = "$GITHUB_SHA"
            test "$published_integrity" = "${{ steps.artifact.outputs.integrity }}"
            echo "already_published=true" >> "$GITHUB_OUTPUT"
          elif grep -Eq '"code"[[:space:]]*:[[:space:]]*"E404"' npm-state.json npm-state.err; then
            echo "already_published=false" >> "$GITHUB_OUTPUT"
          else
            cat npm-state.json npm-state.err >&2
            echo "::error::npm registry state check failed closed."
            exit "$npm_status"
          fi

      - name: Publish package
        if: steps.npm_state.outputs.already_published != 'true'
        run: npm publish "${{ steps.artifact.outputs.tarball }}" --access public --provenance

  verify:
    name: Verify published package
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write

    defaults:
      run:
        working-directory: projects/zdp-platforms/contracts/zdp-client-sdks

    steps:
      - name: Checkout client SDKs
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
          path: projects/zdp-platforms/contracts/zdp-client-sdks

      - name: Download verified package artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: npm-release-artifact
          path: projects/zdp-platforms/contracts/zdp-client-sdks

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "24.18.0"
          package-manager-cache: false
          registry-url: https://registry.npmjs.org

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
          no-cache: true

      - name: Install client SDK dependencies
        run: bun install --frozen-lockfile

      - name: Read verified artifact manifest
        id: artifact
        run: |
          node --input-type=commonjs <<'NODE'
          const fs = require('node:fs');
          const manifest = JSON.parse(fs.readFileSync('release-artifact.json', 'utf8'));
          if (manifest.gitHead !== process.env.GITHUB_SHA) throw new Error('Artifact gitHead does not match release tag SHA.');
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `tarball=${manifest.tarball}\nintegrity=${manifest.integrity}\nmanifest=release-artifact.json\nnotes=release-notes.md\n`);
          NODE

      - name: Verify npm registry result
        run: |
          package_name="$(node -p "require('./package.json').name")"
          package_version="$(node -p "require('./package.json').version")"
          max_attempts=12
          attempt=1

          while [ "$attempt" -le "$max_attempts" ]; do
            published_version="$(npm view "${package_name}@${package_version}" version 2>/dev/null || true)"
            published_git_head="$(npm view "${package_name}@${package_version}" gitHead 2>/dev/null || true)"
            published_integrity="$(npm view "${package_name}@${package_version}" dist.integrity 2>/dev/null || true)"
            if [ "$published_version" = "$package_version" ] && [ "$published_git_head" = "$GITHUB_SHA" ] && [ "$published_integrity" = "${{ steps.artifact.outputs.integrity }}" ]; then
              npm view "${package_name}@${package_version}" dist.tarball
              exit 0
            fi

            if [ "$published_version" = "$package_version" ] && [ -n "$published_git_head" ] && [ "$published_git_head" != "$GITHUB_SHA" ]; then
              echo "::error::Published npm gitHead ${published_git_head} does not match release tag SHA ${GITHUB_SHA}."
              exit 1
            fi
            if [ "$published_version" = "$package_version" ] && [ -n "$published_integrity" ] && [ "$published_integrity" != "${{ steps.artifact.outputs.integrity }}" ]; then
              echo "::error::Published npm integrity ${published_integrity} does not match packed artifact integrity ${{ steps.artifact.outputs.integrity }}."
              exit 1
            fi

            echo "npm metadata is not ready for ${package_name}@${package_version}; retrying (${attempt}/${max_attempts})."
            sleep 5
            attempt=$((attempt + 1))
          done

          echo "::error::npm did not expose ${package_name}@${package_version} after ${max_attempts} attempts."
          exit 1

      - name: Verify published consumer and provenance
        run: >-
          bun scripts/smoke-published-package.ts
          --git-head "$GITHUB_SHA"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_MANIFEST: ${{ steps.artifact.outputs.manifest }}
          RELEASE_NOTES: ${{ steps.artifact.outputs.notes }}
          RELEASE_TARBALL: ${{ steps.artifact.outputs.tarball }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            release_assets="$(mktemp -d)"
            trap 'rm -rf "$release_assets"' EXIT
            gh release view "$GITHUB_REF_NAME" \
              --json tagName,name,isDraft,isPrerelease,body \
              > "$release_assets/release.json"
            node --input-type=commonjs - "$GITHUB_REF_NAME" "$release_assets/release.json" "$release_assets/release-body.md" <<'NODE'
          const fs = require('node:fs');
          const [tag, source, bodyPath] = process.argv.slice(2);
          const release = JSON.parse(fs.readFileSync(source, 'utf8'));
          if (release.tagName !== tag || release.name !== tag || release.isDraft || release.isPrerelease) {
            throw new Error('Existing GitHub Release state does not match the final release contract.');
          }
          fs.writeFileSync(bodyPath, `${release.body.trim()}\n`, 'utf8');
          NODE
            gh release download "$GITHUB_REF_NAME" \
              --pattern "$RELEASE_TARBALL" \
              --pattern "$RELEASE_MANIFEST" \
              --pattern "$RELEASE_NOTES" \
              --dir "$release_assets"
            cmp "$RELEASE_TARBALL" "$release_assets/$RELEASE_TARBALL"
            cmp "$RELEASE_MANIFEST" "$release_assets/$RELEASE_MANIFEST"
            cmp "$RELEASE_NOTES" "$release_assets/$RELEASE_NOTES"
            cmp "$RELEASE_NOTES" "$release_assets/release-body.md"
            echo "Release ${GITHUB_REF_NAME} and its package assets already match."
            exit 0
          fi

          gh release create "$GITHUB_REF_NAME" \
            "$RELEASE_TARBALL#npm package tarball" \
            "$RELEASE_MANIFEST#npm release artifact manifest" \
            "$RELEASE_NOTES#release notes source" \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --notes-file "$RELEASE_NOTES"
